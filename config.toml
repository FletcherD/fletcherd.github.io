base_url = "https://fletcher.cool"
title = "fletcher.cool"
description = "Embedded systems engineer: firmware, hardware, and reverse engineering."
author = "Fletcher"
theme = "tabi"
generate_feeds = true
compile_sass = true
minify_html = true
build_search_index = true
default_language = "en"
taxonomies = [{ name = "tags", feed = true }]

[search]
index_format = "elasticlunr_json"

[markdown]
bottom_footnotes = true
smart_punctuation = true
external_links_class = "external"
github_alerts = true

[markdown.highlighting]
theme = "catppuccin-frappe"
style = "class"

[extra]
theme_switcher = true
remote_repository_url = "https://github.com/FletcherD/fletcherd.github.io"
show_remote_changes = false
show_remote_source = false
copy_button = true
show_reading_time = true
show_date = true
toc = false
quick_navigation_buttons = true
favicon_emoji = "⚡"
menu = [
    { name = "services", url = "services", trailing_slash = true },
    { name = "blog", url = "blog", trailing_slash = true },
    { name = "projects", url = "projects", trailing_slash = true },
    { name = "about", url = "about", trailing_slash = true },
]
feed_icon = true
socials = [
    { name = "github", url = "https://github.com/FletcherD/", icon = "github" },
]
footer_menu = [
    { url = "sitemap.xml", name = "sitemap", trailing_slash = false },
]
allowed_domains = [
    { directive = "font-src", domains = ["'self'", "data:"] },
    { directive = "img-src", domains = ["'self'", "https://*", "data:"] },
    { directive = "media-src", domains = ["'self'", "https://cdn.jsdelivr.net/"] },
    { directive = "script-src", domains = ["'self'"] },
    { directive = "style-src", domains = ["'self'", "https://giscus.app"] },
    { directive = "frame-src", domains = ["player.vimeo.com", "https://www.youtube-nocookie.com"] },
]
enable_csp = true

[extra.giscus]
enabled_for_all_posts = true
automatic_loading = true
repo = "FletcherD/fletcherd.github.io"
repo_id = "R_kgDOOSDbFg"
category = "Announcements"
category_id = "DIC_kwDOOSDbFs4DIw0U"
mapping = "pathname"
strict_title_matching = 1
enable_reactions = 1
comment_box_above_comments = false
light_theme = "noborder_light"
dark_theme = "noborder_dark"
lang = ""
lazy_loading = true
